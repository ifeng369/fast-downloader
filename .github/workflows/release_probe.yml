name: release probe

# 只测发版权限，不编译：手动触发或推送 ci-probe/ 下任意文件
on:
  push:
    paths:
      - 'ci-probe/**'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Prepare tiny file
        run: |
          mkdir -p out
          echo "probe $(date -u +%FT%TZ) run=$GITHUB_RUN_ID" > out/probe.txt
          ls -l out/probe.txt

      - name: Create draft release + upload tiny asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          TAG="probe-tmp-$GITHUB_RUN_ID"
          {
            echo "### release probe"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          CODE=$(curl -s -o /tmp/create.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"probe $TAG\",\"draft\":true,\"prerelease\":true}" \
            "$API/releases")
          echo "create_status=$CODE"
          head -c 400 /tmp/create.json; echo
          echo "- create draft release: **$CODE**" >> "$GITHUB_STEP_SUMMARY"

          ID=$(python3 -c "import json;print(json.load(open('/tmp/create.json')).get('id',''))" 2>/dev/null || true)
          if [ -n "$ID" ]; then
            UP=$(curl -s -o /tmp/up.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: text/plain" \
              --data-binary @out/probe.txt \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=probe.txt")
            echo "upload_status=$UP"
            head -c 300 /tmp/up.json; echo
            echo "- upload asset: **$UP**" >> "$GITHUB_STEP_SUMMARY"

            DEL=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$API/releases/$ID")
            echo "cleanup_status=$DEL"
            echo "- cleanup draft: **$DEL**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- create failed, skip upload" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Probe upload to existing release (v1.3.13)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          RID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "$API/releases/tags/v1.3.13" | python3 -c "import json,sys;print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
          echo "existing_release_id=$RID"
          echo "- existing release id (v1.3.13): \`$RID\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$RID" ]; then
            UP2=$(curl -s -o /tmp/up2.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: text/plain" \
              --data-binary @out/probe.txt \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RID/assets?name=probe-test.txt")
            echo "upload_to_existing_status=$UP2"
            head -c 300 /tmp/up2.json; echo
            echo "- upload to existing release: **$UP2**" >> "$GITHUB_STEP_SUMMARY"
            if [ "$UP2" = "201" ]; then
              AID=$(python3 -c "import json;print(json.load(open('/tmp/up2.json')).get('id',''))")
              curl -s -o /dev/null -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$API/releases/assets/$AID"
              echo "- probe asset deleted" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
