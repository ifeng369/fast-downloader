name: perm probe

on:
  push:
    paths:
      - 'ci-probe/**'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Probe release permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "trigger=${{ github.event_name }}"
          CODE=$(curl -s -o /tmp/body.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"tag_name":"perm-probe-tmp","name":"perm probe","draft":true,"prerelease":true}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases")
          echo "create_status=$CODE"
          head -c 400 /tmp/body.json; echo
          if [ "$CODE" = "201" ]; then
            ID=$(python3 -c "import json;print(json.load(open('/tmp/body.json'))['id'])")
            echo "draft_id=$ID"
            curl -s -o /dev/null -w "delete_status=%{http_code}\n" -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$ID"
          fi
