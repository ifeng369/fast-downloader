name: perm probe

on:
  push:
    paths:
      - 'ci-probe/**'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Probe release permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(curl -s -o /tmp/body.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"tag_name":"perm-probe-tmp","name":"perm probe","draft":true,"prerelease":true}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases")
          BODY=$(head -c 300 /tmp/body.json | tr -d '\n')
          {
            echo "### release create status: $CODE"
            echo '```'
            echo "$BODY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "create_status=$CODE body=$BODY"
          if [ "$CODE" = "201" ]; then
            ID=$(python3 -c "import json;print(json.load(open('/tmp/body.json'))['id'])")
            curl -s -o /dev/null -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$ID"
            echo "draft cleaned"
          else
            exit 1
          fi
