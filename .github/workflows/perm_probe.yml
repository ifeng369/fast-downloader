name: perm probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Print token permissions and try a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          curl -s -D - -o /dev/null -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY" | grep -i "^x-oauth-scopes\|^x-accepted" || true
          CODE=$(curl -s -o /tmp/body.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"tag_name":"perm-probe-tmp","name":"perm probe","draft":true,"prerelease":true}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases")
          echo "create_status=$CODE"
          head -c 500 /tmp/body.json; echo
          if [ "$CODE" = "201" ]; then
            ID=$(grep -o '"id": *[0-9]*' /tmp/body.json | head -1 | grep -o '[0-9]*')
            echo "deleting draft $ID"
            curl -s -o /dev/null -w "delete_status=%{http_code}\n" -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$ID"
          fi
