name: Build Android & Windows

on:
  push:
    branches: [main, feat/uc-drive]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: ver
        shell: bash
        run: |
          VER=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | tr -d '\r')
          echo "app_version=$VER" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          echo "Building version: $VER"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache gopeed source
        uses: actions/cache@v4
        with:
          path: /tmp/gopeed-src
          key: gopeed-${{ vars.GOPEED_VERSION || 'v1.9.3' }}
          restore-keys: |
            gopeed-

      - name: Build libgopeed.aar
        run: bash scripts/build_libgopeed.sh
        env:
          GOPEED_VERSION: ${{ vars.GOPEED_VERSION || 'v1.9.3' }}

      - name: Write key.properties（固定签名证书已入库）
        shell: bash
        run: |
          test -f android/app/upload-keystore.p12 || {
            echo "::error::缺少 android/app/upload-keystore.p12，签名无法固定"
            exit 1
          }
          printf '%s\n' \
            "storeFile=upload-keystore.p12" \
            "storeType=PKCS12" \
            "storePassword=quarklite2026" \
            "keyAlias=quarklite" \
            "keyPassword=quarklite2026" > android/key.properties

      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: 校验签名证书
        shell: bash
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          OUT=$("$BT/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          echo "$OUT"
          EXPECT="eaa2a2d962c8753d3e05f892c0382f8a4418445ed40f4328c3659bf6b9ba452c"
          if ! echo "$OUT" | grep -qi "$EXPECT"; then
            echo "::error::签名证书与仓库内 keystore 不一致（期望 $EXPECT），产物将无法覆盖安装旧版本"
            exit 1
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quarklite-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        shell: bash
        run: |
          VER=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | tr -d '\r')
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          echo "Building version: $VER"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache gopeed-web (windows amd64)
        uses: actions/cache@v4
        with:
          path: C:\gopeed-web
          key: gopeed-web-${{ vars.GOPEED_VERSION || 'v1.9.3' }}-windows-amd64
          restore-keys: |
            gopeed-web-

      - name: Fetch gopeed.exe (web/REST server build)
        shell: bash
        env:
          GOPEED_VERSION: ${{ vars.GOPEED_VERSION || 'v1.9.3' }}
        run: |
          set -euo pipefail
          DEST=/c/gopeed-web
          EXE="$DEST/gopeed.exe"
          if [ ! -f "$EXE" ]; then
            mkdir -p "$DEST"
            URL="https://github.com/GopeedLab/gopeed/releases/download/${GOPEED_VERSION}/gopeed-web-${GOPEED_VERSION}-windows-amd64.zip"
            echo "downloading $URL"
            curl -fL --retry 3 -o "$DEST/gopeed-web.zip" "$URL"
            rm -rf "$DEST/unpacked"
            python -m zipfile -e "$DEST/gopeed-web.zip" "$DEST/unpacked"
            FOUND=$(find "$DEST/unpacked" -name 'gopeed.exe' -type f | head -1)
            test -n "$FOUND"
            cp "$FOUND" "$EXE"
          fi
          ls -l "$EXE"

      - name: Build Windows app
        shell: bash
        run: |
          flutter pub get
          flutter build windows --release

      - name: Bundle gopeed.exe + package zip
        shell: pwsh
        run: |
          $out = "build/windows/x64/runner/Release"
          if (!(Test-Path $out)) { throw "Windows 构建产物目录不存在: $out" }
          Copy-Item "C:\gopeed-web\gopeed.exe" -Destination "$out\gopeed.exe" -Force
          Get-ChildItem $out | Select-Object Name, Length
          $zip = "build/quarklite-windows-x64.zip"
          Compress-Archive -Path "$out\*" -DestinationPath $zip -Force
          Get-Item $zip | Select-Object FullName, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: quarklite-windows
          path: build/quarklite-windows-x64.zip
          if-no-files-found: error

  publish-release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: quarklite-apk
          path: release/android

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: quarklite-windows
          path: release/windows

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | cut -d+ -f1 | tr -d '\r')
          TAG="v$VER"
          echo "Publishing $TAG"
          ls -lh release/android release/windows
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber release/android/* release/windows/*
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Quarklite $TAG" \
              --generate-notes \
              --target "$GITHUB_SHA" \
              release/android/* release/windows/*
          fi
