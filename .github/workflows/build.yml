name: Build Android & Windows

on:
  # 推 tag（v*）时构建并发布 Release
  push:
    tags: ['v*']
    # main 推送只做构建，用来把 flutter/gradle 缓存写到默认分支上：
    # actions/cache 只能读「当前 ref + 默认分支」的缓存，tag 构建读不到分支缓存，
    # 必须让 main 上存一份，tag 构建才能通过 restore-keys 命中（不发 Release）
    branches: [main]
  # 手动重跑（重发某个版本的产物用，不会自动触发）
  workflow_dispatch:
    inputs:
      all_abis:
        description: '构建全部 ABI（armv7 / x86_64 / 通用包）；默认只出 arm64'
        type: boolean
        default: false
      publish:
        description: '构建完成后发布 Release（手动跑一般只需产物，可关掉）'
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 失败时把构建日志贴到 commit comment，便于排查
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read app version
        id: ver
        shell: bash
        run: |
          VER=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | tr -d '\r')
          echo "app_version=$VER" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          echo "Building version: $VER"

      # libgopeed.aar（Gopeed 的 Go 内核，约 15MB）随仓库提交，tag 构建无需再编译。
      # actions/cache 的缓存作用域是 ref，tag 之间不共享，靠缓存每次发版都会冷编译
      # （gomobile bind 约 4-5 分钟），所以改为一律用仓库里的产物；
      # 升级 GOPEED_VERSION 时删掉该文件即可，CI 会重新编译并上传 artifact 供提交入库。
      - name: Check libgopeed.aar
        id: aar
        shell: bash
        run: |
          if [ -f android/app/libs/libgopeed.aar ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            ls -lh android/app/libs/libgopeed.aar
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::仓库内缺少 libgopeed.aar，本次现场编译（约 4-5 分钟），产物会作为 artifact 上传，请提交入库"
          fi

      - name: Setup Go
        # 仅当仓库里没有 libgopeed.aar（升级 GOPEED_VERSION）时才需要现场编译
        if: steps.aar.outputs.exists != 'true'
        uses: actions/setup-go@v6
        with:
          # gomobile 最新版要求 Go >= 1.26
          go-version: '1.27'
          # 仓库根没有 go.mod，禁用自带依赖缓存（gopeed 源码另有缓存）
          cache: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 与 .metadata revision 058e0af2c2b5… 对应；更新的 stable 要求 Gradle ≥ 9.3.1，
          # 而本项目 wrapper 为 8.14（AGP 8.13.2），因此固定到该版本
          flutter-version: '3.44.8'
          cache: true

      - name: Cache gopeed source
        if: steps.aar.outputs.exists != 'true'
        uses: actions/cache@v5
        with:
          path: /tmp/gopeed-src
          key: gopeed-${{ vars.GOPEED_VERSION || 'v1.9.3' }}
          restore-keys: |
            gopeed-

      # 只编需要发布的 ABI：gomobile bind -target=android 默认编 4 个 ABI，
      # 每个都要跑一遍 Go 编译，只发 arm64 时纯属浪费（约省一半时间）
      - name: Resolve ABI targets
        id: abi
        shell: bash
        run: |
          if [ "${{ inputs.all_abis }}" = "true" ]; then
            echo "targets=android" >> "$GITHUB_OUTPUT"
            echo "slug=all" >> "$GITHUB_OUTPUT"
          else
            echo "targets=android/arm64" >> "$GITHUB_OUTPUT"
            echo "slug=arm64" >> "$GITHUB_OUTPUT"
          fi

      - name: Build libgopeed.aar
        if: steps.aar.outputs.exists != 'true'
        run: bash scripts/build_libgopeed.sh
        env:
          GOPEED_VERSION: ${{ vars.GOPEED_VERSION || 'v1.9.3' }}
          GOPEED_TARGETS: ${{ steps.abi.outputs.targets }}

      - name: Upload libgopeed.aar（重建后回传，便于提交入库）
        if: steps.aar.outputs.exists != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: libgopeed-aar
          path: android/app/libs/libgopeed.aar
          if-no-files-found: error

      # Gradle 发行包 + 依赖缓存：命中后省 1-3 分钟
      # 只缓存 wrapper dists 与 modules-2；整个 ~/.gradle/caches 有 1.8GB，
      # 每次上传/下载都拖慢（transforms / build-cache 可重建，不缓存）
      # key 只含 gradle 配置（不含 pubspec.lock）：改依赖后仍能命中，避免每次重建整块缓存
      - name: Cache gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Verify libgopeed.aar
        shell: bash
        run: |
          test -f android/app/libs/libgopeed.aar || {
            echo "::error::缺少 libgopeed.aar（缓存与构建都失败）"
            exit 1
          }
          ls -lh android/app/libs/libgopeed.aar

      - name: Write key.properties（固定签名证书已入库）
        shell: bash
        run: |
          test -f android/app/upload-keystore.jks || {
            echo "::error::缺少 android/app/upload-keystore.jks，签名无法固定"
            exit 1
          }
          printf '%s\n' \
            "storeFile=upload-keystore.jks" \
            "storeType=JKS" \
            "storePassword=quarklite2026" \
            "keyAlias=quarklite" \
            "keyPassword=quarklite2026" > android/key.properties

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee build-android.log
          if [ "${{ inputs.all_abis }}" = "true" ]; then
            echo "== 构建全部 ABI"
            flutter build apk --release --dart-define=APP_VERSION=${APP_VERSION%%+*} 2>&1 | tee -a build-android.log
            flutter build apk --release --split-per-abi --dart-define=APP_VERSION=${APP_VERSION%%+*} 2>&1 | tee -a build-android.log
          else
            echo "== 仅构建 arm64-v8a（更快，并把 AAR 里其余 ABI 的原生库滤掉）"
            export ORG_GRADLE_PROJECT_targetAbi=arm64-v8a
            flutter build apk --release --target-platform android-arm64 --dart-define=APP_VERSION=${APP_VERSION%%+*} 2>&1 | tee -a build-android.log
          fi

      # AGP 的 abiFilters/v1 签名在 Flutter 构建里不稳定：
      # 这里对产物做确定性处理——删掉非目标 ABI 的原生库，再用 apksigner 显式签 v1+v2+v3。
      - name: 瘦身 APK（仅目标 ABI）并重新签名
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ steps.abi.outputs.slug }}"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          KS_FILE="android/app/$(sed -n 's/^storeFile=//p' android/key.properties | tr -d '\r')"
          KS_PASS=$(sed -n 's/^storePassword=//p' android/key.properties | tr -d '\r')
          KEY_ALIAS=$(sed -n 's/^keyAlias=//p' android/key.properties | tr -d '\r')
          KEY_PASS=$(sed -n 's/^keyPassword=//p' android/key.properties | tr -d '\r')
          for APK in build/app/outputs/flutter-apk/*release.apk; do
            [ -f "$APK" ] || continue
            echo "== 处理 $APK (target=$TARGET)"
            if [ "$TARGET" != "all" ]; then
              python3 - "$APK" <<'PY'
          import shutil, sys, zipfile
          src = sys.argv[1]
          tmp = src + '.slim'
          dropped = 0
          with zipfile.ZipFile(src) as zi, zipfile.ZipFile(tmp, 'w', zipfile.ZIP_DEFLATED) as zo:
              for info in zi.infolist():
                  name = info.filename
                  if name.startswith('lib/') and not name.startswith('lib/arm64-v8a/'):
                      dropped += info.file_size
                      continue
                  zo.writestr(info, zi.read(name))
          shutil.move(tmp, src)
          print(f'dropped native libs: {dropped/1048576:.1f} MB')
          PY
            fi
            "$BT/zipalign" -f -p 4 "$APK" "$APK.aligned"
            "$BT/apksigner" sign \
              --ks "$KS_FILE" --ks-type JKS \
              --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" \
              --ks-key-alias "$KEY_ALIAS" \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              --min-sdk-version 21 \
              --out "$APK.aligned.signed" "$APK.aligned"
            mv "$APK.aligned.signed" "$APK"
            rm -f "$APK.aligned"
            ls -lh "$APK"
          done

      - name: 收集 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/apk
          SRC=build/app/outputs/flutter-apk
          if [ "${{ inputs.all_abis }}" = "true" ]; then
            cp "$SRC/app-release.apk" artifacts/apk/fast-downloader-universal.apk
            cp "$SRC/app-arm64-v8a-release.apk" artifacts/apk/fast-downloader-arm64-v8a.apk
            cp "$SRC/app-armeabi-v7a-release.apk" artifacts/apk/fast-downloader-armeabi-v7a.apk
            cp "$SRC/app-x86_64-release.apk" artifacts/apk/fast-downloader-x86_64.apk
          else
            cp "$SRC/app-release.apk" artifacts/apk/fast-downloader-arm64-v8a.apk
          fi
          ls -lh artifacts/apk

      - name: 失败时贴出构建日志
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -f build-android.log ]; then
            { echo '```'; tail -n 150 build-android.log; echo '```'; } > "$RUNNER_TEMP/body.md"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
              -F body=@"$RUNNER_TEMP/body.md" || true
          fi

      - name: 校验签名证书
        shell: bash
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          OUT=$("$BT/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          echo "$OUT"
          EXPECT="eaa2a2d962c8753d3e05f892c0382f8a4418445ed40f4328c3659bf6b9ba452c"
          if ! echo "$OUT" | grep -qi "$EXPECT"; then
            echo "::error::签名证书与仓库内 keystore 不一致（期望 $EXPECT），产物将无法覆盖安装旧版本"
            exit 1
          fi
          # v1(JAR) 签名：旧系统与部分国产安装器只认 v1，缺了会报「没有开发者证书」
          # 注意：不能只看 META-INF/*.SF（依赖也可能自带），必须由 apksigner 判定有效性
          # minSdk=24 的包 apksigner 默认不校验 v1，必须显式 --min-sdk-version
          VERIFY=$("$BT/apksigner" verify --min-sdk-version 21 -v build/app/outputs/flutter-apk/app-release.apk)
          echo "$VERIFY" | grep -E 'Verified using v[123] scheme|Number of signers'
          if ! echo "$VERIFY" | grep -q 'Verified using v1 scheme (JAR signing): true'; then
            echo "::error::APK 的 v1(JAR) 签名无效，旧系统/部分安装器会报「没有开发者证书」"
            exit 1
          fi
          # 默认模式只保留 arm64 原生库：libgopeed.aar 自带三种 ABI，
          # 漏过滤会让包体多出约 30MB（x86_64/armeabi-v7a 的 libgojni.so）
          if [ "${{ inputs.all_abis }}" != "true" ]; then
            BAD=$(unzip -l build/app/outputs/flutter-apk/app-release.apk \
              | awk '{print $4}' | grep -E '^lib/' | cut -d/ -f2 | sort -u \
              | grep -v '^arm64-v8a$' || true)
            if [ -n "$BAD" ]; then
              echo "::error::APK 混入非 arm64 原生库（约多 30MB）: $BAD"
              exit 1
            fi
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v6
        with:
          name: fast-downloader-apk
          path: artifacts/apk/*.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read app version
        shell: bash
        run: |
          VER=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | tr -d '\r')
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          echo "Building version: $VER"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true

      - name: Cache gopeed-web (windows amd64)
        uses: actions/cache@v5
        with:
          path: C:\gopeed-web
          key: gopeed-web-${{ vars.GOPEED_VERSION || 'v1.9.3' }}-windows-amd64
          restore-keys: |
            gopeed-web-

      - name: Fetch gopeed.exe (web/REST server build)
        shell: bash
        env:
          GOPEED_VERSION: ${{ vars.GOPEED_VERSION || 'v1.9.3' }}
        run: |
          set -euo pipefail
          DEST=/c/gopeed-web
          EXE="$DEST/gopeed.exe"
          if [ ! -f "$EXE" ]; then
            mkdir -p "$DEST"
            URL="https://github.com/GopeedLab/gopeed/releases/download/${GOPEED_VERSION}/gopeed-web-${GOPEED_VERSION}-windows-amd64.zip"
            echo "downloading $URL"
            curl -fL --retry 3 -o "$DEST/gopeed-web.zip" "$URL"
            rm -rf "$DEST/unpacked"
            python -m zipfile -e "$DEST/gopeed-web.zip" "$DEST/unpacked"
            FOUND=$(find "$DEST/unpacked" -name 'gopeed.exe' -type f | head -1)
            test -n "$FOUND"
            cp "$FOUND" "$EXE"
          fi
          ls -l "$EXE"

      - name: Build Windows app
        shell: bash
        run: |
          flutter pub get
          flutter build windows --release --dart-define=APP_VERSION=${APP_VERSION%%+*}

      - name: Bundle gopeed.exe
        shell: pwsh
        run: |
          $out = "build/windows/x64/runner/Release"
          if (!(Test-Path $out)) { throw "Windows 构建产物目录不存在: $out" }
          Copy-Item "C:\gopeed-web\gopeed.exe" -Destination "$out\gopeed.exe" -Force
          Get-ChildItem $out | Select-Object Name, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          # 直接上传目录：GitHub 只会包一层 zip，避免"两层压缩"
          name: fast-downloader-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  publish-release:
    needs: [build-android, build-windows]
    # 只有 tag（v*）推送才发 Release；main 推送/手动触发默认只出产物
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download APK artifacts
        uses: actions/download-artifact@v7
        with:
          name: fast-downloader-apk
          path: release/android

      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: fast-downloader-windows
          path: release/windows

      - name: 打包 Windows 发布包（单层，无额外目录）
        shell: bash
        run: |
          set -euo pipefail
          cd release/windows
          python3 - <<'PY'
          import os, zipfile
          with zipfile.ZipFile('../fast-downloader-windows-x64.zip', 'w', zipfile.ZIP_DEFLATED,
                               compresslevel=9) as z:
              for root, _, files in os.walk('.'):
                  for f in files:
                      p = os.path.join(root, f)
                      z.write(p, os.path.relpath(p, '.'))
          print('zip ok')
          PY
          ls -lh ../fast-downloader-windows-x64.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | cut -d+ -f1 | tr -d '\r')
          TAG="v$VER"
          echo "Publishing $TAG"
          ls -lh release/android release/*.zip
          # 下载完整性校验：SHA-256 清单随包发布（应用内/代理下载后可对比）
          sha256sum release/android/*.apk release/*.zip | sed 's#release/##' > release/SHA256SUMS.txt
          cat release/SHA256SUMS.txt
          # latest.json：应用端检查更新只读这个文件（不调 GitHub API，避免匿名限流 403）
          python3 - "$TAG" <<'PY'
          import glob, hashlib, json, os, sys
          tag = sys.argv[1]
          ver = tag[1:] if tag.startswith('v') else tag
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}"
          assets = []
          for path in sorted(glob.glob('release/android/*.apk')) + sorted(glob.glob('release/*.zip')):
              name = os.path.basename(path)
              data = open(path, 'rb').read()
              assets.append({
                  'name': name,
                  'url': f'{base}/{name}',
                  'size': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
          out = {'version': ver, 'tag': tag, 'notes': '', 'assets': assets}
          open('release/latest.json', 'w', encoding='utf-8').write(
              json.dumps(out, ensure_ascii=False, indent=2))
          print(json.dumps(out, ensure_ascii=False)[:500])
          PY
          cat release/latest.json
          # GitHub API 偶发 403/5xx：发版动作重试 3 次，避免整条流水线白跑
          retry() {
            delay=10
            for i in 1 2 3 4 5; do
              if "$@"; then return 0; fi
              echo "::warning::第 $i 次失败，${delay}s 后重试: $*"
              sleep "$delay"
              delay=$((delay * 2))
            done
            return 1
          }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            retry gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber release/android/* release/*.zip release/SHA256SUMS.txt release/latest.json
          else
            retry gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "fast-downloader $TAG" \
              --generate-notes \
              --target "$GITHUB_SHA" \
              release/android/* release/*.zip release/SHA256SUMS.txt release/latest.json
          fi

          # 清理不属于本次构建的旧资产：产物改过名（app-*.apk → quarklite-*.apk），
          # --clobber 只覆盖同名文件，旧名字会一直留在 Release 里，必须显式删除
          EXPECTED=$( (cd release && ls android/*.apk *.zip SHA256SUMS.txt latest.json 2>/dev/null) | xargs -r -n1 basename | sort || true)
          if [ -n "$EXPECTED" ]; then
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              -q '.assets[].name' | while read -r name; do
              [ -z "$name" ] && continue
              if ! printf '%s\n' "$EXPECTED" | grep -qxF "$name"; then
                echo "::notice::删除过期资产 $name"
                gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" -y || true
              fi
            done
          fi
