name: Build Android & Windows

on:
  push:
    branches: [main, feat/uc-drive]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 失败时把构建日志贴到 commit comment，便于排查
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: ver
        shell: bash
        run: |
          VER=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | tr -d '\r')
          echo "app_version=$VER" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          echo "Building version: $VER"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 与 .metadata revision 058e0af2c2b5… 对应；更新的 stable 要求 Gradle ≥ 9.3.1，
          # 而本项目 wrapper 为 8.14（AGP 8.13.2），因此固定到该版本
          flutter-version: '3.44.8'
          cache: true

      - name: Cache gopeed source
        uses: actions/cache@v4
        with:
          path: /tmp/gopeed-src
          key: gopeed-${{ vars.GOPEED_VERSION || 'v1.9.3' }}
          restore-keys: |
            gopeed-

      - name: Build libgopeed.aar
        run: bash scripts/build_libgopeed.sh
        env:
          GOPEED_VERSION: ${{ vars.GOPEED_VERSION || 'v1.9.3' }}

      - name: Write key.properties（固定签名证书已入库）
        shell: bash
        run: |
          test -f android/app/upload-keystore.jks || {
            echo "::error::缺少 android/app/upload-keystore.jks，签名无法固定"
            exit 1
          }
          printf '%s\n' \
            "storeFile=upload-keystore.jks" \
            "storeType=JKS" \
            "storePassword=quarklite2026" \
            "keyAlias=quarklite" \
            "keyPassword=quarklite2026" > android/key.properties

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee build-android.log
          flutter build apk --release 2>&1 | tee -a build-android.log
          flutter build apk --release --split-per-abi 2>&1 | tee -a build-android.log

      - name: 失败时贴出构建日志
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -f build-android.log ]; then
            { echo '```'; tail -n 150 build-android.log; echo '```'; } > "$RUNNER_TEMP/body.md"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
              -F body=@"$RUNNER_TEMP/body.md" || true
          fi

      - name: 校验签名证书
        shell: bash
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          OUT=$("$BT/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          echo "$OUT"
          EXPECT="eaa2a2d962c8753d3e05f892c0382f8a4418445ed40f4328c3659bf6b9ba452c"
          if ! echo "$OUT" | grep -qi "$EXPECT"; then
            echo "::error::签名证书与仓库内 keystore 不一致（期望 $EXPECT），产物将无法覆盖安装旧版本"
            exit 1
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quarklite-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        shell: bash
        run: |
          VER=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | tr -d '\r')
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          echo "Building version: $VER"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true

      - name: Cache gopeed-web (windows amd64)
        uses: actions/cache@v4
        with:
          path: C:\gopeed-web
          key: gopeed-web-${{ vars.GOPEED_VERSION || 'v1.9.3' }}-windows-amd64
          restore-keys: |
            gopeed-web-

      - name: Fetch gopeed.exe (web/REST server build)
        shell: bash
        env:
          GOPEED_VERSION: ${{ vars.GOPEED_VERSION || 'v1.9.3' }}
        run: |
          set -euo pipefail
          DEST=/c/gopeed-web
          EXE="$DEST/gopeed.exe"
          if [ ! -f "$EXE" ]; then
            mkdir -p "$DEST"
            URL="https://github.com/GopeedLab/gopeed/releases/download/${GOPEED_VERSION}/gopeed-web-${GOPEED_VERSION}-windows-amd64.zip"
            echo "downloading $URL"
            curl -fL --retry 3 -o "$DEST/gopeed-web.zip" "$URL"
            rm -rf "$DEST/unpacked"
            python -m zipfile -e "$DEST/gopeed-web.zip" "$DEST/unpacked"
            FOUND=$(find "$DEST/unpacked" -name 'gopeed.exe' -type f | head -1)
            test -n "$FOUND"
            cp "$FOUND" "$EXE"
          fi
          ls -l "$EXE"

      - name: Build Windows app
        shell: bash
        run: |
          flutter pub get
          flutter build windows --release

      - name: Bundle gopeed.exe
        shell: pwsh
        run: |
          $out = "build/windows/x64/runner/Release"
          if (!(Test-Path $out)) { throw "Windows 构建产物目录不存在: $out" }
          Copy-Item "C:\gopeed-web\gopeed.exe" -Destination "$out\gopeed.exe" -Force
          Get-ChildItem $out | Select-Object Name, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          # 直接上传目录：GitHub 只会包一层 zip，避免"两层压缩"
          name: quarklite-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  publish-release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: quarklite-apk
          path: release/android

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: quarklite-windows
          path: release/windows

      - name: 打包 Windows 发布包（单层，无额外目录）
        shell: bash
        run: |
          set -euo pipefail
          cd release/windows
          python3 - <<'PY'
          import os, zipfile
          with zipfile.ZipFile('../quarklite-windows-x64.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for root, _, files in os.walk('.'):
                  for f in files:
                      p = os.path.join(root, f)
                      z.write(p, os.path.relpath(p, '.'))
          print('zip ok')
          PY
          ls -lh ../quarklite-windows-x64.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | cut -d+ -f1 | tr -d '\r')
          TAG="v$VER"
          echo "Publishing $TAG"
          ls -lh release/android release/*.zip
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber release/android/* release/*.zip
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Quarklite $TAG" \
              --generate-notes \
              --target "$GITHUB_SHA" \
              release/android/* release/*.zip
          fi
