name: release probe (tag)

# 只测「tag 触发的运行」里的发版权限，不编译
on:
  push:
    tags:
      - 'probe-*'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release + upload tiny asset from a TAG run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          TAG="$GITHUB_REF_NAME"
          echo "running for tag=$TAG sha=$GITHUB_SHA"
          {
            echo "### tag-context release probe"
            echo ""
            echo "- ref: \`$GITHUB_REF\`"
            echo "- sha: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "probe from tag run" > probe.txt

          CODE=$(curl -s -o /tmp/create.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"probe $TAG\",\"draft\":true,\"prerelease\":true,\"target_commitish\":\"$GITHUB_SHA\"}" \
            "$API/releases")
          echo "create_status=$CODE"
          head -c 400 /tmp/create.json; echo
          echo "- create draft release: **$CODE**" >> "$GITHUB_STEP_SUMMARY"

          ID=$(python3 -c "import json;print(json.load(open('/tmp/create.json')).get('id',''))" 2>/dev/null || true)
          if [ -n "$ID" ]; then
            UP=$(curl -s -o /tmp/up.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: text/plain" \
              --data-binary @probe.txt \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=probe.txt")
            echo "upload_status=$UP"
            echo "- upload asset: **$UP**" >> "$GITHUB_STEP_SUMMARY"

            DEL=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$API/releases/$ID")
            echo "cleanup_status=$DEL"
            echo "- cleanup draft: **$DEL**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- create failed, skip upload" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
